name: Deploy static site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build
        env:
          PUBLIC_FIREBASE_API_KEY: "AIzaSyA-RavvTxomqodSO_jRNUQq-JyaIcHIHds"
          PUBLIC_FIREBASE_AUTH_DOMAIN: "elquijoyas-web.firebaseapp.com"
          PUBLIC_FIREBASE_PROJECT_ID: "elquijoyas-web"
          PUBLIC_FIREBASE_STORAGE_BUCKET: "elquijoyas-web.firebasestorage.app"
          PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "248537585559"
          PUBLIC_FIREBASE_APP_ID: "1:248537585559:web:b12dd8d694d796ed24d6d2"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
