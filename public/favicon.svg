<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="crystalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A6D56" />
      <stop offset="50%" stop-color="#C78883" />
      <stop offset="100%" stop-color="#C5A059" />
    </linearGradient>
    <linearGradient id="moonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0E0B4" />
      <stop offset="100%" stop-color="#C5A059" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background circle with parchment tint -->
  <circle cx="32" cy="32" r="30" fill="#FAF6F0" stroke="#EBDDCB" stroke-width="1.5" />
  
  <!-- Watercolor crescent moon -->
  <path d="M38 12 C33 12 28 16 28 22 C28 28 33 32 38 32 C34 32 30 27 30 22 C30 17 34 12 38 12 Z" fill="url(#moonGrad)" filter="url(#softGlow)" opacity="0.9" />

  <!-- Crystal cluster center -->
  <!-- Left crystal -->
  <polygon points="20,48 24,34 29,38 27,50" fill="#4A6D56" opacity="0.85" />
  <polygon points="24,34 29,38 28,49 22,46" fill="#7A9A84" opacity="0.75" />

  <!-- Main tall crystal -->
  <polygon points="32,24 38,32 35,52 29,52 26,34" fill="url(#crystalGrad)" />
  <polygon points="32,24 38,32 35,52 32,52" fill="#C78883" opacity="0.65" />
  <line x1="32" y1="24" x2="32" y2="52" stroke="#FAF6F0" stroke-width="0.8" opacity="0.6" />

  <!-- Right crystal -->
  <polygon points="35,36 43,30 45,46 38,50" fill="#B66D4E" opacity="0.85" />
  <polygon points="43,30 45,46 41,50 36,44" fill="#E5A992" opacity="0.7" />

  <!-- Sparkle stars -->
  <circle cx="44" cy="18" r="1.5" fill="#C5A059" />
  <circle cx="18" cy="28" r="1" fill="#C5A059" opacity="0.8" />
  <circle cx="48" cy="40" r="1" fill="#4A6D56" opacity="0.7" />
</svg>
